<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu Tiên Truyện 2D — Quản Trị</title>
<style>
  :root { --bg:#141018; --panel:#1e1826; --line:#3a3046; --text:#eee6d8; --dim:#a89c86; --gold:#e8c66a; --red:#ff6a5a; --green:#7ee07e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; color:var(--gold); }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav button, button { background:#3a2a1c; color:var(--text); border:1px solid #a07c44; border-radius:4px; padding:5px 10px; cursor:pointer; }
  nav button.on { background:#6a4a26; }
  button.danger { border-color:var(--red); }
  main { padding:16px; max-width:1300px; margin:auto; }
  input, select, textarea { background:#0c0a10; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:5px 8px; }
  table { border-collapse:collapse; width:100%; margin:8px 0; }
  th, td { border-bottom:1px solid var(--line); padding:4px 6px; text-align:left; vertical-align:top; }
  th { color:var(--gold); font-weight:600; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px; }
  .card b { display:block; font-size:22px; color:var(--gold); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .muted { color:var(--dim); }
  .err { color:var(--red); }
  pre { white-space:pre-wrap; background:#0c0a10; padding:8px; border-radius:4px; max-height:300px; overflow:auto; }
  #login { max-width:360px; margin:80px auto; background:var(--panel); padding:20px; border-radius:8px; border:1px solid var(--line); }
  #login input { width:100%; margin:6px 0; }
</style>
</head>
<body>
<div id="login">
  <h2 style="color:var(--gold);margin-top:0">Đăng nhập quản trị</h2>
  <input id="em" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Mật khẩu" autocomplete="current-password">
  <button id="loginBtn">Đăng nhập</button>
  <p class="err" id="loginErr"></p>
  <p class="muted">Tài khoản nhân viên được tạo bằng lệnh <code>npm run admin:create -w server</code> — không có tài khoản mặc định.</p>
</div>
<div id="app" hidden>
  <header>
    <h1>Tu Tiên Truyện 2D — Quản Trị</h1>
    <nav id="nav"></nav>
    <span class="muted" id="who"></span>
    <button id="logout">Đăng xuất</button>
  </header>
  <main id="view"></main>
</div>
<script>
const API = location.origin;
let token = sessionStorage.getItem('tt_admin') || '';
let me = null;
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function api(path, body, method) {
  const r = await fetch(API + path, { method: method || (body ? 'POST' : 'GET'), headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}
function table(rows, cols) {
  if (!rows || !rows.length) return '<p class="muted">Không có dữ liệu</p>';
  cols = cols || Object.keys(rows[0]);
  return '<table><tr>' + cols.map((c) => `<th>${esc(c)}</th>`).join('') + '</tr>' + rows.map((r) => '<tr>' + cols.map((c) => `<td>${typeof r[c] === 'object' && r[c] !== null ? '<pre>' + esc(JSON.stringify(r[c])) + '</pre>' : esc(r[c])}</td>`).join('') + '</tr>').join('') + '</table>';
}
const PAGES = {
  'Tổng quan': async (v) => {
    const o = await api('/api/admin/overview');
    v.innerHTML = `<div class="cards">
      <div class="card">Trực tuyến<b>${o.world.online}</b></div><div class="card">Instance<b>${o.world.instances}</b></div>
      <div class="card">Quái vật<b>${o.world.monsters}</b></div><div class="card">Tick TB (ms)<b>${o.world.tickMsAvg}</b></div>
      <div class="card">Tài khoản<b>${o.counts.accounts}</b></div><div class="card">Nhân vật<b>${o.counts.characters}</b></div>
      <div class="card">Báo cáo mở<b>${o.counts.open_reports}</b></div><div class="card">Lỗi 24h<b>${o.counts.errors_24h}</b></div>
      <div class="card">Tổng vàng<b>${Number(o.money.gold).toLocaleString('vi-VN')}</b></div><div class="card">Tổng linh thạch<b>${Number(o.money.spirit_stones).toLocaleString('vi-VN')}</b></div></div>
      <p class="muted">Sự kiện: ${esc(o.world.events.join(', ') || 'không')} — Uptime ${o.world.uptimeSec}s</p>
      <h3>Người chơi trực tuyến</h3>${table(await api('/api/admin/online'))}`;
  },
  'Tài khoản': async (v) => {
    v.innerHTML = `<div class="row"><input id="q" placeholder="Email hoặc tên nhân vật"><button id="s">Tìm</button></div><div id="res"></div><div id="detail"></div>`;
    const load = async () => {
      const rows = await api('/api/admin/accounts?q=' + encodeURIComponent($('#q').value));
      $('#res').innerHTML = table(rows.map((r) => ({ ...r, characters: (r.characters || []).map((c) => `${c.name}#${c.id}`).join(', '), act: r.id })), ['id', 'email', 'role', 'status', 'verified', 'banned_until', 'muted_until', 'characters', 'last_login_at', 'act'])
        .replace(/<td>(\d+)<\/td><\/tr>/g, (m, id) => `<td><button data-acc="${id}">Chi tiết</button></td></tr>`);
      v.querySelectorAll('[data-acc]').forEach((b) => b.onclick = () => detail(b.dataset.acc));
    };
    const detail = async (id) => {
      const d = await api('/api/admin/accounts/' + id);
      $('#detail').innerHTML = `<h3>Tài khoản #${id} — ${esc(d.account.email)}</h3>
        <div class="row"><input id="reason" placeholder="Lý do"><input id="hours" type="number" placeholder="Giờ (trống = vĩnh viễn)">
        <button class="danger" id="ban">Khóa</button><button id="unban">Mở khóa</button>
        <input id="mins" type="number" placeholder="Phút cấm chat" value="60"><button id="mute">Cấm chat</button><button id="unmute">Bỏ cấm</button>
        <select id="role"><option>player</option><option>support</option><option>gm</option><option>admin</option></select><button id="setRole">Đặt vai trò</button></div>
        <h4>Nhân vật</h4>${table(d.characters)}<div id="chars"></div><h4>Phiên</h4>${table(d.sessions)}<h4>Nhật ký bảo mật</h4>${table(d.security)}`;
      const act = async (fn) => { try { await fn(); alert('Đã thực hiện'); detail(id); } catch (e) { alert(e.message); } };
      $('#ban').onclick = () => act(() => api(`/api/admin/accounts/${id}/ban`, { reason: $('#reason').value || 'vi phạm', hours: $('#hours').value ? Number($('#hours').value) : undefined }));
      $('#unban').onclick = () => act(() => api(`/api/admin/accounts/${id}/unban`, {}));
      $('#mute').onclick = () => act(() => api(`/api/admin/accounts/${id}/mute`, { minutes: Number($('#mins').value) }));
      $('#unmute').onclick = () => act(() => api(`/api/admin/accounts/${id}/unmute`, {}));
      $('#setRole').onclick = () => act(() => api(`/api/admin/accounts/${id}/role`, { role: $('#role').value }));
      const chars = $('#chars');
      for (const c of d.characters) {
        const b = document.createElement('button'); b.textContent = 'Xem ' + c.name; b.onclick = () => character(c.id); chars.appendChild(b);
      }
    };
    $('#s').onclick = load; load();
  },
  'Nhân vật': async (v) => { v.innerHTML = `<div class="row"><input id="cid" type="number" placeholder="ID nhân vật"><button id="go">Xem</button></div><div id="cv"></div>`; $('#go').onclick = () => character($('#cid').value); },
  'Kinh tế': async (v) => {
    const e = await api('/api/admin/economy');
    v.innerHTML = `<div class="cards"><div class="card">Tổng vàng<b>${Number(e.totals.gold).toLocaleString('vi-VN')}</b></div><div class="card">Tổng linh thạch<b>${Number(e.totals.spirit_stones).toLocaleString('vi-VN')}</b></div><div class="card">Chợ đang bán<b>${e.market.active}</b></div><div class="card">Đã bán 24h<b>${e.market.sold_24h}</b></div></div>
      <h3>Dòng tiền 24 giờ (nguồn sinh / tiêu hao)</h3>${table(e.flows)}<h3>Giàu nhất</h3>${table(e.topRich)}
      <h3>Giao dịch gần đây</h3>${table(await api('/api/admin/trades'), ['id', 'name_a', 'name_b', 'offer_a', 'offer_b', 'fee_a', 'fee_b', 'completed_at'])}`;
  },
  'Nhật ký': async (v) => {
    v.innerHTML = `<div class="row"><input id="ch" type="number" placeholder="ID nhân vật (trống = tất cả)"><button data-k="ledger">Sổ cái tiền</button><button data-k="item-logs">Vật phẩm</button><button data-k="chat">Chat</button><button data-k="logs">Thao tác quản trị</button><button data-k="errors">Lỗi server</button><button data-k="mail-outbox">Thư đi (email)</button></div><div id="out"></div>`;
    v.querySelectorAll('[data-k]').forEach((b) => b.onclick = async () => { try { $('#out').innerHTML = table(await api(`/api/admin/${b.dataset.k}?char=${$('#ch').value || 0}`)); } catch (e) { $('#out').innerHTML = `<p class="err">${esc(e.message)}</p>`; } });
  },
  'Nội dung': async (v) => {
    const c = await api('/api/admin/content');
    v.innerHTML = `<h3>Ghi đè nội dung (tắt vật phẩm/nhiệm vụ, chỉnh giá cửa hàng)</h3>
      <div class="row"><select id="kind"><option>shop</option><option>item</option><option>quest</option><option>boss</option></select><input id="ref" placeholder="ID (vd pill_hp_1)"><input id="data" placeholder='{"price":20} hoặc {"disabled":true}' style="width:280px"><button id="save">Lưu</button><button id="del">Xóa ghi đè</button></div>
      ${table(c.overrides)}
      <h3>Triệu hồi Boss</h3><div class="row"><select id="boss">${c.bosses.map((b) => `<option value="${b.id}">${esc(b.name)} (${b.rank})</option>`).join('')}</select><select id="map">${c.maps.map((m) => `<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><button id="spawn">Triệu hồi</button></div>
      <h3>Danh mục</h3><details><summary>Vật phẩm (${c.items.length})</summary>${table(c.items)}</details><details><summary>Nhiệm vụ (${c.quests.length})</summary>${table(c.quests)}</details>`;
    const run = async (fn) => { try { await fn(); alert('Đã lưu'); PAGES['Nội dung'](v); } catch (e) { alert(e.message); } };
    $('#save').onclick = () => run(() => api('/api/admin/content/override', { kind: $('#kind').value, ref: $('#ref').value, data: JSON.parse($('#data').value || '{}') }));
    $('#del').onclick = () => run(() => api('/api/admin/content/override', { kind: $('#kind').value, ref: $('#ref').value, data: null }));
    $('#spawn').onclick = () => run(() => api('/api/admin/boss/spawn', { monster: $('#boss').value, map: $('#map').value }));
  },
  'Sự kiện': async (v) => {
    const c = await api('/api/admin/content'); const ev = await api('/api/admin/events');
    v.innerHTML = `<h3>Tạo sự kiện</h3><div class="row"><select id="key">${c.events.map((e) => `<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><input id="start" type="datetime-local"><input id="dur" type="number" placeholder="Phút"><button id="create">Tạo</button></div>
      <h3>Thông báo toàn server</h3><div class="row"><input id="msg" style="width:420px" placeholder="Nội dung"><button id="ann">Gửi</button></div>
      <h3>Đang diễn ra</h3>${table(ev.active)}<h3>Lịch</h3>${table(ev.scheduled.map((e) => ({ ...e, act: e.id })))}`.replace(/<td>(\d+)<\/td><\/tr>/g, (m, id) => `<td><button data-cancel="${id}">Hủy</button></td></tr>`);
    $('#create').onclick = async () => { try { await api('/api/admin/events', { key: $('#key').value, startsAt: $('#start').value ? new Date($('#start').value).toISOString() : undefined, durationMin: $('#dur').value ? Number($('#dur').value) : undefined }); PAGES['Sự kiện'](v); } catch (e) { alert(e.message); } };
    $('#ann').onclick = async () => { try { await api('/api/admin/announce', { message: $('#msg').value }); alert('Đã gửi'); } catch (e) { alert(e.message); } };
    v.querySelectorAll('[data-cancel]').forEach((b) => b.onclick = async () => { await api(`/api/admin/events/${b.dataset.cancel}/cancel`, {}); PAGES['Sự kiện'](v); });
  },
  'Báo cáo': async (v) => {
    const rows = await api('/api/admin/reports');
    v.innerHTML = table(rows.map((r) => ({ id: r.id, reporter: r.reporter, target: r.target, reason: r.reason, details: r.details, status: r.status, created_at: r.created_at, context: r.context, act: r.id })))
      .replace(/<td>(\d+)<\/td><\/tr>/g, (m, id) => `<td><button data-res="${id}">Đã xử lý</button><button data-dis="${id}">Bỏ qua</button></td></tr>`);
    v.querySelectorAll('[data-res]').forEach((b) => b.onclick = async () => { await api(`/api/admin/reports/${b.dataset.res}/resolve`, { status: 'resolved' }); PAGES['Báo cáo'](v); });
    v.querySelectorAll('[data-dis]').forEach((b) => b.onclick = async () => { await api(`/api/admin/reports/${b.dataset.dis}/resolve`, { status: 'dismissed' }); PAGES['Báo cáo'](v); });
  },
  'Nhân viên': async (v) => { v.innerHTML = '<p class="muted">Đổi vai trò ở trang Tài khoản (chỉ admin).</p>' + table(await api('/api/admin/staff')); },
};
async function character(id) {
  const d = await api('/api/admin/characters/' + id);
  const host = $('#cv') || $('#detail');
  host.innerHTML = `<h3>${esc(d.character.name)} #${id} ${d.online ? '(trực tuyến)' : ''}</h3>
    <p>Cảnh giới ${d.character.realm_idx} tầng ${d.character.layer} — tu vi ${d.character.tu_vi} — bản đồ ${esc(d.character.map_id)} — vàng ${d.wallet?.gold} — linh thạch ${d.wallet?.spirit_stones}</p>
    <div class="row"><input id="gi" placeholder="ID vật phẩm"><input id="gq" type="number" value="1"><input id="gr" placeholder="Lý do (bắt buộc)"><button id="grant">Gửi vật phẩm qua thư</button>
    <select id="cur"><option>gold</option><option>spirit_stones</option></select><input id="cd" type="number" placeholder="+/- số lượng"><button id="adj">Điều chỉnh tiền</button><button class="danger" id="kick">Đá khỏi game</button></div>
    <h4>Vật phẩm</h4>${table(d.items)}<h4>Nhiệm vụ</h4>${table(d.quests)}<h4>Linh thú</h4>${table(d.pets)}<h4>Đột phá</h4>${table(d.cultivation)}`;
  const act = async (fn) => { try { await fn(); alert('Đã thực hiện'); character(id); } catch (e) { alert(e.message); } };
  $('#grant').onclick = () => act(() => api(`/api/admin/characters/${id}/grant`, { item: $('#gi').value, qty: Number($('#gq').value), reason: $('#gr').value }));
  $('#adj').onclick = () => act(() => api(`/api/admin/characters/${id}/currency`, { currency: $('#cur').value, delta: Number($('#cd').value), reason: $('#gr').value || 'điều chỉnh' }));
  $('#kick').onclick = () => act(() => api(`/api/admin/characters/${id}/kick`, {}));
}
function nav(page) {
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('on', b.textContent === page));
  const v = $('#view'); v.innerHTML = '<p class="muted">Đang tải...</p>';
  PAGES[page](v).catch((e) => v.innerHTML = `<p class="err">${esc(e.message)}</p>`);
}
async function start() {
  try { me = await api('/api/admin/me'); } catch { $('#login').hidden = false; $('#app').hidden = true; return; }
  $('#login').hidden = true; $('#app').hidden = false; $('#who').textContent = `${me.email} (${me.role})`;
  $('#nav').innerHTML = ''; for (const p of Object.keys(PAGES)) { const b = document.createElement('button'); b.textContent = p; b.onclick = () => nav(p); $('#nav').appendChild(b); }
  nav('Tổng quan');
}
$('#loginBtn').onclick = async () => {
  try {
    const r = await fetch(API + '/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('#em').value, password: $('#pw').value, device: 'admin-dashboard' }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.error);
    token = d.token; sessionStorage.setItem('tt_admin', token); start();
  } catch (e) { $('#loginErr').textContent = e.message; }
};
$('#logout').onclick = async () => { await api('/api/auth/logout', {}).catch(() => {}); sessionStorage.removeItem('tt_admin'); token = ''; start(); };
start();
</script>
</body>
</html>
