# Reverse proxy HTTPS/WSS cho Tu Tiên Truyện 2D
worker_processes auto;
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  types { application/wasm wasm; }
  sendfile on;
  gzip on;
  gzip_types application/javascript application/json text/css application/wasm;
  client_max_body_size 1m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream game { server server:8080; keepalive 64; }

  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }
  server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location /ws {
      proxy_pass http://game;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }
    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://game;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    location /metrics { allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; deny all; proxy_pass http://game; }
    location / { proxy_pass http://game; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = / { return 302 /play/index.html; }
  }
}
